[workspace]
resolver = "2"
members = [
    "crates/swarm-core",
    "crates/swarm-cli",
]
default-members = ["crates/swarm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TentacleCat"]
license = "MIT"
description = "High-performance Rust simulation suite and reproduction lab for Swarmalator dynamical systems"
repository = "https://github.com/TentacleCat/swarm-lab-rs"
readme = "README.md"

[workspace.dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
csv = "1.3"
